[package]
name = "scrape-le"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
description = "Check whether a page is scrapeable before the scraper is written"
authors = ["Nolin D Naidoo"]
homepage = "https://letools.dev"
repository = "https://github.com/nolindnaidoo/scrape-le"
keywords = ["scraping", "robots-txt", "anti-bot", "headless", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "scrape-le"
path = "src/main.rs"

# The decided render stack (AGENTS.md — sync CDP, no runtime), used today
# only by examples/spike.rs; it graduates to [dependencies] when render.rs
# lands. anyhow is spike-local error glue, not a crate-wide commitment.
[dev-dependencies]
headless_chrome = "1"
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Every output of this tool is a claim someone scripts against — a verdict,
# a timing, a byte count. A wrapped number is silently wrong data in a
# report whose whole value is honesty, which is worse than a crash — so
# overflow keeps panicking in release, as it does in debug. (Same rule as
# pixelcoords and pixelactions.)
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate relaxations, same policy as pixelcoords/pixelactions: no
# inline #[allow] anywhere (CI enforces); anything relaxed must be listed
# here, visibly.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
