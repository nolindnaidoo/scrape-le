# The Rust CLI's CI. Lives beside ci.yml rather than inside it because
# ci.yml is byte-identical across the ten *-le repos (letools-site's
# fleet check); this file is invisible to that check.
#
# Paths include the extension's detector sources on purpose: parity must
# fail when EITHER side drifts from the shared corpus, and an edit to
# src/detectors/heuristics.ts would otherwise land green.
name: CI (crate)

on:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - 'signatures/**'
      - 'fixtures/**'
      - 'src/detectors/**'
      - 'src/utils/url.ts'
      - 'scripts/check-signature-parity.ts'
      - '.github/workflows/ci-crate.yml'
  pull_request:
    paths:
      - 'crate/**'
      - 'signatures/**'
      - 'fixtures/**'
      - 'src/detectors/**'
      - 'src/utils/url.ts'
      - 'scripts/check-signature-parity.ts'
      - '.github/workflows/ci-crate.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi

  # The 90% per-module coverage floor on detect/ starts enforcing when the
  # detection port lands; a floor over a stub with no modules would be a
  # vacuous green. Model it on pixelcoords ci.yml's coverage job
  # (cargo-llvm-cov, per-module floor, report uploaded even on failure).

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit
      - run: cargo audit

  # Fails when the extension's in-code detection data and the shared
  # corpus (signatures/, fixtures/) disagree — the reason both frontends
  # live in one repo at all.
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Signature and fixture parity
        working-directory: .
        run: bun scripts/check-signature-parity.ts
