# The Rust CLI's CI. Lives beside ci.yml rather than inside it because
# ci.yml is byte-identical across the ten *-le repos (letools-site's
# fleet check); this file is invisible to that check.
#
# Paths include the extension's detector sources on purpose: parity must
# fail when EITHER side drifts from the shared corpus, and an edit to
# src/detectors/heuristics.ts would otherwise land green.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a
  # commit with no way to be verified. Dispatch is the escape hatch.
  # ci.yml cannot have this: it is byte-identical across the ten *-le
  # repos and the fleet check enforces that.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - 'src/detectors/**'
      - 'src/mcp/**'
      - 'src/utils/url.ts'
      - 'scripts/check-signature-parity.ts'
      - 'scripts/check-differential.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
  pull_request:
    paths:
      - 'crate/**'
      - 'src/detectors/**'
      - 'src/mcp/**'
      - 'src/utils/url.ts'
      - 'scripts/check-signature-parity.ts'
      - 'scripts/check-differential.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Whether anything the Rust jobs depend on actually moved. "Docs" is
  # deliberately narrow — *.md, LICENSE and the agent instruction files —
  # and anything unrecognised, or an unreadable diff, counts as code. The
  # default is always to run more, never less.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            range="$before..HEAD"
          fi

          if ! files="$(git diff --name-only "$range")"; then files=""; fi

          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | LICENSE | .cursorrules | .windsurfrules | .clinerules) ;;
              .cursor/* | .github/copilot-instructions.md) ;;
              *) code=true; break ;;
            esac
          done <<EOF
          $files
          EOF

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code, files changed:"
          echo "$files"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for detect/.
  # Enforced per module, not on the total: a total hides one module
  # sliding while the others carry it. Scoped to detect/ because
  # everything else is I/O verified by the contract and scenario jobs.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is
        # exactly when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on detect/
        run: |
          python3 - <<'PY'
          import json, sys
          # A backstop against a module nobody tested, not a target. It sits
          # well below where the code actually is — the lowest measured module
          # in the family was 92.69% against the old 90.0 floor, i.e. 2.69
          # points from failing a build over a single new branch. A floor that
          # tracks actual coverage stops being a floor and becomes a tax on
          # writing the next module. Do not raise this to chase a number.
          FLOOR = 75.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              if "/detect/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in detect/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  # What only a real browser can prove: the page probes, login-form
  # evidence, and that a fully rendered clean page reaches `clear`.
  # Ubuntu and Windows runners ship Chrome; macOS does not, so it
  # installs one rather than silently skipping the job.
  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install a browser
        if: runner.os == 'macOS'
        run: brew install --cask google-chrome
      - name: Scenarios against a real browser
        env:
          SCRAPE_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-audit
      - run: cargo audit

  # Fails when the extension's in-code detection data and the shared
  # corpus (signatures/, fixtures/) disagree — the reason both frontends
  # live in one repo at all.
  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Signature and fixture parity
        working-directory: .
        run: bun scripts/check-signature-parity.ts

  # ---------------------------------------------------------------------
  # The six below exist because something real got through a green suite.
  # Each one names the bug it would have caught.
  #
  # **None of them touches the network.** This crate's product is a page
  # fetch, so every job here is aimed at what it can answer without
  # leaving the machine: the five vendor signature files, the robots.txt
  # corpus, the URL validator, and the two files it is handed by name.
  # Where a job would need a request to mean anything, it says so instead
  # of pretending.
  # ---------------------------------------------------------------------

  # Inputs a real machine holds and a fixture directory cannot: a
  # byte-order mark, a file that is not UTF-8, a FIFO, a path over 260
  # characters. Aimed at `--signatures` and at a `--input` batch whose
  # every entry is malformed, which is refused before a socket opens. The
  # tree is built at runtime because Windows cannot check half of it into
  # git, and every case the platform cannot express is skipped by name.
  #
  # Found in this release: a byte-order mark hid a JSON batch, and
  # `--signatures` naming a named pipe blocked forever.
  hazards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous inputs against the built binary
        run: cargo test --test hazards

  # Behaviour that differs by operating system. envsync-le shipped a
  # release whose report used `\` on Windows and `/` everywhere else, so
  # the whole family now asserts it.
  #
  # **This crate's report carries one path** — `screenshot` — and
  # producing one needs a browser, which belongs to `scenarios`. Its shape
  # is pinned instead by a unit test on the pure name builder, which uses
  # a literal `/` rather than a `PathBuf`. The paths this job can reach
  # without a browser are the ones the tool *prints*, and those are echoes
  # of what the caller typed: they are asserted to come back unchanged,
  # because a message that rewrites the path it was given cannot be
  # grepped for.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Paths, case folding, reserved names and early stdin
        run: cargo test --test platform
      # Windows ignores TZ entirely, so a suite that quietly depended on
      # it would be red there and nowhere else. Both runs are compared
      # line for line rather than merely required to pass.
      - name: The suite answers the same with TZ set and unset
        shell: bash
        run: |
          set -euo pipefail
          # Names and outcomes, not the summary lines: those carry a
          # duration, and two runs of the same suite never agree on one.
          names() { grep -E '^test ' | grep -v '^test result:' | sort; }
          TZ=UTC cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-utc.txt"
          unset TZ
          cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-unset.txt"
          test -s "$RUNNER_TEMP/tz-utc.txt"
          diff -u "$RUNNER_TEMP/tz-utc.txt" "$RUNNER_TEMP/tz-unset.txt"

  # The corpus pins cases somebody thought of; this generates the ones
  # nobody did and feeds them to BOTH servers.
  #
  # Scope is the shared tool — `analyze_robots_txt`, one schema, two
  # implementations — and not the two surfaces around it. The extension is
  # IDE-first and the CLI terminal-first, so batching, `--agent`,
  # `--no-render` and the exit codes exist on one side only; that is
  # design, not drift, and crate/SPEC.md lists it under "Deliberate
  # divergences". What may never differ is the answer to the same call.
  #
  # `matchHeaders` is **not** covered here, and that is stated rather than
  # skipped: no shared MCP tool carries it, and the only other way to
  # reach it is a page fetch these jobs must never make. Its
  # cross-frontend contract is fixtures/antibot-headers.json, run against
  # both implementations by `parity` above.
  #
  # Found in this release: three answers that differed between the two
  # servers — a lower-case `infinity` crawl-delay, a second crawl-delay in
  # a second group, and a non-ASCII pattern measured in bytes on one side
  # and UTF-16 code units on the other.
  differential:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # Fixed so a failure reproduces; printed on every run either way.
      DIFFERENTIAL_SEED: '20260812'
      DIFFERENTIAL_CASES: '600'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: cargo build --locked
      - name: Generated cases through both MCP servers
        working-directory: .
        run: bun scripts/check-differential.ts

  # A standing net over the robots.txt parser and the URL validator,
  # time-boxed rather than run to convergence. It drives
  # `analyze_robots_txt`, which takes a body the caller already has, so
  # the target is the pure layer and nothing reaches the network.
  #
  # Matching is RFC 9309 — longest match wins, `*` is any run of
  # characters, `$` anchors the end — and every one of those becomes a
  # regex built from text somebody else wrote. Pathological input is a
  # real risk there and a hang is a real bug, so the generator writes
  # patterns nobody would write by hand and every case has a deadline.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      SCRAPE_LE_FUZZ_SECONDS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Sixty seconds against the robots parser
        run: cargo test --test fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling on a corpus generated from a fixed seed, plus two
  # linearity checks: four times the documents, and four times the rules
  # in one document. The second is the one a sibling missed — every rule
  # becomes a regex and longest-match-wins reads all of them, so anything
  # that re-reads per rule shows up there and nowhere else.
  budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      SCRAPE_LE_BUDGET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: 500 documents inside the budget, and linear in both directions
        run: cargo test --release --locked --test budget -- --test-threads=1 --nocapture

  # Does the crate open what it claims?
  #
  # The extractor crates in this family answer that with one file per
  # extension in their alias table. **This crate has no format table**, so
  # the job is adapted rather than dropped: what it claims is five
  # anti-bot vendors, four checks and four verdicts. Every vendor must be
  # reachable through every kind of signal it declares, every declared
  # signal must reach the page probe, and every check and verdict must be
  # reachable from evidence. A vendor in the corpus that nothing can
  # surface inflates what the tool says it covers.
  #
  # The marker check is not decoration: `cargo test <filter>` exits 0 when
  # the filter matches nothing, so a renamed test would pass this job
  # silently.
  coverage-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every vendor, signal, check and verdict
        shell: bash
        run: |
          set -euo pipefail
          # Serialised on purpose: --nocapture lets these tests interleave their
          # output when run in parallel, so a prefix lands on another test's line
          # and the greps below miss a line the run actually printed.
          cargo test --bins coverage_matrix -- --nocapture --test-threads=1 2>&1 \
            | tee "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: .* page signals' "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: .* vendor signals' "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 4 checks and 4 verdicts' "$RUNNER_TEMP/coverage-matrix.txt"
