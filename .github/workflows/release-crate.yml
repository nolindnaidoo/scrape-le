# Publishes the Rust CLI to crates.io. Separate from release.yml, which
# publishes the extension and the npm MCP server — the two products in
# this repo release on their own cadence and their own tags.
#
# Dispatch-only, like release.yml: a tag push must not be able to spend
# a version by itself, because a crates.io version can never be reused.
name: Release (crate)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io (off runs the full dry run only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-crate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Everything that must be true before a version is spent. Runs
  # whether or not `publish` is set, so the dry run is a first-class
  # way to check a release without risking one.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

      # The corpus lives inside crate/ precisely so the packaged tarball
      # is self-contained. This asserts it, because a crate that builds
      # here and fails on a consumer's machine is the worst outcome.
      - name: The packaged crate carries its own corpus
        run: |
          set -euo pipefail
          list=$(cargo package --list --allow-dirty)
          for required in \
            signatures/cloudflare.toml \
            signatures/recaptcha.toml \
            signatures/hcaptcha.toml \
            signatures/datadome.toml \
            signatures/perimeterx.toml \
            fixtures/antibot-headers.json \
            fixtures/url.json \
            fixtures/mcp-analyze-robots.json \
            fixtures/robots/cases.json
          do
            if ! printf '%s\n' "$list" | grep -qx "$required"; then
              echo "::error::$required is missing from the package — the crate would not build for a consumer"
              exit 1
            fi
          done
          echo "corpus present in the tarball"

      # A crates.io version can never be reused, so spending one by
      # accident is unrecoverable. Checked before the dry run rather
      # than discovered by a failed upload.
      - name: The version is not already on crates.io
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "local: $version"
          body=$(curl -sS "https://crates.io/api/v1/crates/scrape-le/versions" || echo '{}')
          if printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(v["num"] for v in d.get("versions", [])))' 2>/dev/null | grep -qx "$version"; then
            echo "::error::$version is already on crates.io; a published version can never be reused"
            exit 1
          fi
          echo "$version is unpublished — safe to release"

      - name: The changelog documents this version
        working-directory: .
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' crate/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if ! grep -q "^## \[$version\]" crate/CHANGELOG.md; then
            echo "::error::crate/CHANGELOG.md has no entry for $version"
            exit 1
          fi

      - run: cargo publish --dry-run

  publish:
    needs: preflight
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Verify the token before doing anything irreversible
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
